<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prank Master Control</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { margin: 0; background-color: #111827; color: white; padding: 1rem; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; box-sizing: border-box; }
        .header { background-color: #451a03; border: 1px solid #78350f; color: #f59e0b; padding: 0.75rem; text-align: center; font-weight: bold; border-radius: 0.5rem; margin-bottom: 1rem; }
        #feed { flex: 1; overflow-y: auto; background-color: #030712; padding: 1rem; border-radius: 0.75rem; border: 1px solid #374151; font-size: 0.875rem; }
        .input-row { display: flex; gap: 0.5rem; margin-top: 1rem; }
        input { flex: 1; background-color: #1f2937; border: 1px solid #374151; padding: 0.75rem; border-radius: 0.75rem; color: white; outline: none; }
        button { background-color: #b91c1c; color: white; border: none; padding: 0 1.5rem; border-radius: 0.75rem; font-weight: bold; cursor: pointer; }
        .log-entry { padding: 0.5rem; margin-bottom: 0.5rem; border-radius: 4px; background: #1f2937; }
    </style>
</head>
<body>
    <div class="header">😈 PRANK CONTROL PANEL (LIVE)</div>
    <div id="feed"><div style="color: #6b7280; text-align: center; font-style: italic;">Waiting for incoming messages...</div></div>
    <div class="input-row">
        <input id="prank-input" type="text" placeholder="Type ridiculous response...">
        <button id="send-btn">SEND</button>
    </div>
    <script>
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_KEY = "PASTE_YOUR_NEW_KEY_HERE";
        
        let supabase = null;
        if (typeof window.supabase !== 'undefined') {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        const feed = document.getElementById('feed');
        const prankInput = document.getElementById('prank-input');
        const sendBtn = document.getElementById('send-btn');

        async function sendPrankMessage() {
            const text = prankInput.value.trim();
            if (!text || !supabase) return;
            prankInput.value = '';
            await supabase.from('prank_chat').insert([{ sender: 'pranker', message: text }]);
        }

        function appendToFeed(sender, text) {
            const isVictim = sender === 'victim';
            const html = `<div class="log-entry"><b>${isVictim ? 'VICTIM:' : 'YOU:'}</b> ${text}</div>`;
            if (feed.innerHTML.includes("Waiting for")) feed.innerHTML = "";
            feed.insertAdjacentHTML('beforeend', html);
            feed.scrollTop = feed.scrollHeight;
        }

        sendBtn.addEventListener('click', sendPrankMessage);
        prankInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendPrankMessage(); });

        if (supabase) {
            supabase.channel('control_room')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'prank_chat' }, payload => {
                    appendToFeed(payload.new.sender, payload.new.message);
                }).subscribe();
        }
    </script>
</body>
</html>
