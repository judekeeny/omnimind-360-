<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniMind AI - Beta v4.2</title>
    <script src="https://jsdelivr.net"></script>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex flex-col">

    <!-- Top Bar -->
    <div class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div>
            <span class="font-semibold tracking-wide text-emerald-400">OmniMind Quantum-LLM</span>
        </div>
        <span class="text-xs bg-slate-800 px-2 py-1 rounded text-slate-400 border border-slate-700">Creativity: Max (Experimental)</span>
    </div>

    <!-- Chat Area -->
    <div id="chat-box" class="flex-1 overflow-y-auto p-6 space-y-6 max-w-3xl mx-auto w-full">
        <!-- System Greeting -->
        <div class="bg-slate-900/50 border border-slate-800 p-4 rounded-xl text-sm text-slate-400 text-center">
            🤖 Connected to Cluster-9. High-temperature logic enabled. Ask me anything.
        </div>
    </div>

    <!-- Typing Indicator (Hidden by default) -->
    <div id="typing-indicator" class="hidden max-w-3xl mx-auto w-full px-6 py-2">
        <div class="bg-slate-900 border border-slate-800/80 inline-flex items-center space-x-2 px-4 py-3 rounded-2xl rounded-tl-none shadow-sm">
            <span class="text-xs text-slate-400 font-medium mr-1">OmniMind is thinking</span>
            <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0ms"></div>
            <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 150ms"></div>
            <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 300ms"></div>
        </div>
    </div>

    <!-- Input Bar -->
    <div class="p-6 bg-gradient-to-t from-slate-950 via-slate-950 to-transparent">
        <div class="max-w-3xl mx-auto flex items-center bg-slate-900 border border-slate-800 rounded-2xl p-2 focus-within:border-emerald-500/50 shadow-xl transition-all">
            <input id="user-input" type="text" placeholder="Message OmniMind..." class="w-full bg-transparent p-3 outline-none text-slate-200 placeholder-slate-500 text-sm">
            <button id="send-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold p-3 rounded-xl transition-colors">
                <svg xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        // REPLACE THESE WITH YOUR ACTUAL SUPABASE DETAILS
        const SUPABASE_URL = "uprupjzzafdyolungeyx";
        const SUPABASE_KEY = "sb_publishable_j2oROaZA-W9YyDIiaBeZgQ_HLQXCLCK";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const typingIndicator = document.getElementById('typing-indicator');

        // Send victim's message to Supabase
        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('victim', text);
            userInput.value = '';

            await supabase.from('prank_chat').insert([{ sender: 'victim', message: text }]);
        }

        function appendMessage(sender, text) {
            const isAI = sender === 'pranker';
            const msgHtml = `
                <div class="flex ${isAI ? 'justify-start' : 'justify-end'} animate-fade-in">
                    <div class="${isAI ? 'bg-slate-900 border border-slate-800 text-slate-200 rounded-tl-none' : 'bg-emerald-600 text-white rounded-tr-none'} max-w-[80%] p-4 rounded-2xl shadow-sm text-sm leading-relaxed">
                        <div class="text-[10px] uppercase tracking-wider ${isAI ? 'text-emerald-400' : 'text-emerald-200'} mb-1 font-bold">${isAI ? '🤖 OmniMind' : '👤 You'}</div>
                        <div>${text}</div>
                    </div>
                </div>`;
            chatBox.insertAdjacentHTML('beforeend', msgHtml);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        // Listen for the pranker's ridiculous answers live
        supabase.channel('prank_room')
            .on('postgres_changes', { event: 'INSERT', table: 'prank_chat' }, payload => {
                if (payload.new.sender === 'pranker') {
                    // Trigger fake AI thinking animation
                    typingIndicator.classList.remove('hidden');
                    chatBox.scrollTop = chatBox.scrollHeight;

                    setTimeout(() => {
                        typingIndicator.classList.add('hidden');
                        appendMessage('pranker', payload.new.message);
                    }, 2000); // 2 second delay to simulate AI typing
                }
            }).subscribe();
    </script>
</body>
</html>
