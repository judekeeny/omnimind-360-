<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniMind AI - Beta v4.2</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { margin: 0; background-color: #020617; color: #f8fafc; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; }
        .top-bar { background-color: #0f172a; border-bottom: 1px solid #1e293b; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
        .status { display: flex; align-items: center; gap: 0.75rem; }
        .dot { width: 12px; height: 12px; background-color: #10b981; border-radius: 50%; }
        .badge { background-color: #1e293b; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; color: #94a3b8; border: 1px solid #334155; }
        #chat-box { flex: 1; overflow-y: auto; padding: 1.5rem; max-width: 48rem; width: 100%; margin: 0 auto; box-sizing: border-box; }
        .system-msg { background-color: rgba(15, 23, 42, 0.5); border: 1px solid #1e293b; padding: 1rem; border-radius: 0.75rem; font-size: 0.875rem; color: #94a3b8; text-align: center; margin-bottom: 1.5rem; }
        .msg-container { display: flex; margin-bottom: 1.5rem; }
        .msg-left { justify-content: flex-start; }
        .msg-right { justify-content: flex-end; }
        .bubble { max-width: 80%; padding: 1rem; border-radius: 1rem; font-size: 0.875rem; line-height: 1.5; }
        .bubble-ai { background-color: #0f172a; border: 1px solid #1e293b; color: #e2e8f0; border-top-left-radius: 0; }
        .bubble-user { background-color: #059669; color: white; border-top-right-radius: 0; }
        .sender-tag { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem; font-weight: bold; }
        .tag-ai { color: #10b981; }
        .tag-user { color: #a7f3d0; }
        #typing-indicator { max-width: 48rem; width: 100%; margin: 0 auto; padding: 0 1.5rem 0.5rem 1.5rem; box-sizing: border-box; }
        .hidden { display: none !important; }
        .dots-box { background-color: #0f172a; border: 1px solid #1e293b; display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.75rem 1rem; border-radius: 1rem; border-top-left-radius: 0; }
        .dot-bounce { width: 8px; height: 8px; background-color: #94a3b8; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }
        .input-area { padding: 1.5rem; background: linear-gradient(to top, #020617, #020617 70%, transparent); }
        .input-wrapper { max-width: 48rem; margin: 0 auto; display: flex; background-color: #0f172a; border: 1px solid #1e293b; border-radius: 1rem; padding: 0.5rem; }
        input { flex: 1; background: transparent; border: none; outline: none; color: #e2e8f0; padding: 0.75rem; font-size: 0.875rem; }
        button { background-color: #059669; color: white; border: none; padding: 0.75rem 1rem; border-radius: 0.75rem; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="status"><div class="dot"></div><span style="font-weight: 600; color: #10b981;">OmniMind Quantum-LLM</span></div>
        <span class="badge">Creativity: Max</span>
    </div>
    <div id="chat-box"><div class="system-msg">🤖 Connected to Cluster-9. High-temperature logic enabled. Ask me anything.</div></div>
    <div id="typing-indicator" class="hidden">
        <div class="dots-box">
            <span style="font-size: 12px; color: #94a3b8; margin-right: 4px;">OmniMind is thinking</span>
            <div class="dot-bounce" style="animation-delay: -0.32s"></div>
            <div class="dot-bounce" style="animation-delay: -0.16s"></div>
            <div class="dot-bounce" style="animation-delay: 0s"></div>
        </div>
    </div>
    <div class="input-area">
        <div class="input-wrapper">
            <input id="user-input" type="text" placeholder="Message OmniMind...">
            <button id="send-btn">Send</button>
        </div>
    </div>
    <script>
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_KEY = "PASTE_YOUR_NEW_KEY_HERE";
        
        let supabase = null;
        if (typeof window.supabase !== 'undefined') {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        }

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const typingIndicator = document.getElementById('typing-indicator');
        let fallbackTimer = null;

        const pigeonReplies = [
            "🤖 Did you know pigeons can recognize all 26 letters of the English alphabet? They are watching.",
            "🤖 Processing request... Did you know pigeon milk looks like cottage cheese? Both parents make it.",
            "🤖 I cannot answer right now. Recalculating the aerodynamic efficiency of a street pigeon.",
            "🤖 Fun Fact: Pigeons are surprisingly good at math. They can count and sort items just like monkeys."
        ];

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('victim', text);
            userInput.value = '';
            clearTimeout(fallbackTimer);

            if (supabase) {
                await supabase.from('prank_chat').insert([{ sender: 'victim', message: text }]);
            }

            fallbackTimer = setTimeout(() => { triggerPigeonResponse(); }, 15000); 
        }

        function triggerPigeonResponse() {
            typingIndicator.classList.remove('hidden');
            chatBox.scrollTop = chatBox.scrollHeight;
            setTimeout(() => {
                typingIndicator.classList.add('hidden');
                const randomReply = pigeonReplies[Math.floor(Math.random() * pigeonReplies.length)];
                appendMessage('pranker', randomReply);
            }, 2000);
        }

        function appendMessage(sender, text) {
            const isAI = sender === 'pranker';
            const msgHtml = `
                <div class="msg-container ${isAI ? 'msg-left' : 'msg-right'}">
                    <div class="bubble ${isAI ? 'bubble-ai' : 'bubble-user'}">
                        <div class="sender-tag ${isAI ? 'tag-ai' : 'tag-user'}">${isAI ? '🤖 OmniMind' : '👤 You'}</div>
                        <div>${text}</div>
                    </div>
                </div>`;
            chatBox.insertAdjacentHTML('beforeend', msgHtml);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        if (supabase) {
            supabase.channel('prank_room')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'prank_chat' }, payload => {
                    if (payload.new.sender === 'pranker') {
                        clearTimeout(fallbackTimer);
                        typingIndicator.classList.remove('hidden');
                        chatBox.scrollTop = chatBox.scrollHeight;
                        setTimeout(() => {
                            typingIndicator.classList.add('hidden');
                            appendMessage('pranker', payload.new.message);
                        }, 2000);
                    }
                }).subscribe();
        }
    </script>
</body>
</html>
